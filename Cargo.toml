[package]
name = "zephyr_vault"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"      # Chiffrement AES-GCM
argon2 = "0.5.3"        # Dérivation de clé Argon2
rand = "0.8.5"          # Génération de sel et IV
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rpassword = "7.3"
base64 = "0.22"         # Encodage des données binaires
csv="1.3"