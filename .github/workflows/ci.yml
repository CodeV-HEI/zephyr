name: CI/CD

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]

env:
    CARGO_TERM_COLOR: always

jobs:
    # Job 1 : Formatage (rustfmt)
    fmt:
        name: Check formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  components: rustfmt
                  override: true
            - name: Run rustfmt
              run: cargo fmt --all -- --check

    # Job 2 : Linting (Clippy)
    clippy:
        name: Run Clippy linter
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  components: clippy
                  override: true
            - name: Run Clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

    # Job 3 : Audit des dépendances (cargo-audit)
    audit:
        name: Security audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/install@v0.1
              with:
                  crate: cargo-audit
                  version: latest
            - name: Run cargo-audit
              run: cargo audit

    # Job 4 : Compilation et tests
    build:
        name: Build & Test
        runs-on: ubuntu-latest
        needs: [fmt, clippy, audit] # optionnel : attendre que les checks passent
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
            - name: Build in release mode
              run: cargo build --release --verbose
            - name: Run tests (if any)
              run: cargo test --verbose
            - name: Run binary smoke test
              run: ./target/release/zephyr_vault --help
